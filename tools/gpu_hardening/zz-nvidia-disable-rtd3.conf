# Disable NVIDIA runtime D3 (RTD3) dynamic power management.
#
# Why: on this box (RTX 4060 Laptop, driver 535.x) the GPU recurrently
# wedges into P8 @ 210 MHz with "SW Power Cap" asserted and never
# recovers without a reboot. It has happened twice, both times after
# idle->load transitions under runtime power management. Forcing the
# GPU to stay out of RTD3 removes the transition that triggers the
# wedge, at the cost of a few watts at idle.
#
# 0x00 = never use runtime D3 power management.
options nvidia NVreg_DynamicPowerManagement=0x00
