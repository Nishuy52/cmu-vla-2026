[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-core"
version = "0.1.0"
description = "Pure-Python core for the CMU VLA challenge (deterministic geometric backbone + checkpointed reasoning)."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "rosbags>=0.11",  # pure-Python ROS 2 bag read/write for the offline replay harness (no ROS)
]

[project.optional-dependencies]
test = ["pytest>=8"]
# `dev` adds parallel test execution (pytest-xdist). Not required to run the suite;
# only the full milestone gate uses it: `pytest -m "" -n auto` (see src/README.md).
dev = ["pytest>=8", "pytest-xdist>=3"]
# `llm` is needed only to actually CALL a configured openai/anthropic-kind provider
# slot (core/llm/providers.py imports each SDK lazily inside the call, so the fast
# test tier runs fine with fakes and no SDK installed at all — see tests/llm/fakes.py).
# Install this to drive the local-LLM slot (docs/local_llm_plan.md) or a real
# primary/secondary API slot.
llm = ["openai>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Default (iterating) tier: skip the slow simulated-ticking / multi-scene-battery tests.
# Full milestone gate runs everything: `pytest -m ""` (add `-n auto` with the dev group
# for parallel execution). See src/README.md "Test tiers".
addopts = "-q -m 'not slow'"
markers = [
    "slow: runtime dominated by simulated FSM ticking or multi-scene batteries; excluded from the default fast tier, run at milestones via `pytest -m \"\"`",
]
