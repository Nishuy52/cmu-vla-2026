[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-core"
version = "0.1.0"
description = "Pure-Python core for the CMU VLA challenge (deterministic geometric backbone + checkpointed reasoning)."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "rosbags>=0.11",  # pure-Python ROS 2 bag read/write for the offline replay harness (no ROS)
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
